# Render Blueprint: Next.js Node web service + PostgreSQL (free tier).
# Dashboard → New → Blueprint → select this repo.
#
# Free-tier notes: the web service sleeps after 15 min idle (~1 min cold start);
# the free database expires 30 days after creation unless upgraded.
services:
  - type: web
    name: dealdesk-crm
    runtime: node
    plan: free
    region: oregon
    # Free instances have no pre-deploy command, so migrations run during the build.
    # `migrate deploy` only applies pending migrations; it never resets or drops data.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealdesk-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      # Set to the service's public URL, e.g. https://dealdesk-crm.onrender.com
      # (used in password-reset links and OAuth callbacks).
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: DealDesk

databases:
  - name: dealdesk-db
    plan: free
    region: oregon
    databaseName: dealdesk
    user: dealdesk
